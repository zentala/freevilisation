packages:
  - packages/*
  - apps/*
  - tools/*
allowBuilds:
  esbuild: true
  workerd: true
# Packages exempt from the release-age quarantine below. Both settings must
# stay together: an exclude list without minimumReleaseAge does nothing.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260819.1"
  - miniflare@5.20260815.0-alpha
  - wrangler@4.124.0
  - "@vitest/expect@4.1.11"
  - "@vitest/mocker@4.1.11"
  - "@vitest/pretty-format@4.1.11"
  - "@vitest/runner@4.1.11"
  - "@vitest/snapshot@4.1.11"
  - "@vitest/spy@4.1.11"
  - "@vitest/utils@4.1.11"
  - vitest@4.1.11
